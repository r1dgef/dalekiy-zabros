<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Далёкий заброс</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
:root{--bg:#17213b;--card:#22305a;--line:#3a4a7c;--tx:#f4f1ff;--soft:#a9b4d9;--gold:#ffc857}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:16px "Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation;user-select:none}
main{max-width:820px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;font:800 22px "Trebuchet MS",system-ui,sans-serif}
.hud small{font:14px system-ui;color:var(--soft);font-weight:400}
#cv{width:100%;aspect-ratio:16/9;border-radius:14px;background:#000;touch-action:none;cursor:pointer;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:inherit;border:0}
.sell{background:var(--gold);color:#1d2340;border-radius:12px;padding:13px;font-weight:800}
.sell.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.up{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
.up b{font-size:15px}.up span{font-size:12px;color:var(--soft)}.up em{font-style:normal;font-weight:800;color:var(--gold)}
button:disabled{opacity:.4}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--gold);color:#1d2340;padding:10px 18px;border-radius:20px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<div class="hud"><div>💰 <span id="mo">0</span></div><div id="bg"></div></div>
<canvas id="cv" width="800" height="450" aria-label="Fishing"></canvas>
<div class="row"><button class="sell" id="sell"></button><button class="sell alt" id="dbl"></button></div>
<div class="ups"><button class="up" id="u0"></button><button class="up" id="u1"></button><button class="up" id="u2"></button></div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=Math.random;
const D={ru:{ti:'Далёкий заброс',sell:'Продать улов',dbl:'×2 за рекламу',u0:'Сила броска',u1:'Крючки',u2:'Удача',lv:'ур. ',hint:'Зажмите и отпустите, чтобы забросить',short:'Не долетело',newz:'Новая зона: ',best:'Рекорд ',max:'МАКС',z:['Мелководье','Бухта','Открытое море','Глубина','Бездна']},
en:{ti:'Far Cast',sell:'Sell catch',dbl:'×2 with an ad',u0:'Throw power',u1:'Hooks',u2:'Luck',lv:'lv ',hint:'Hold and release to cast',short:'Too short',newz:'New zone: ',best:'Best ',max:'MAX',z:['Shallows','Bay','Open sea','Deep','Abyss']}};
let lang='ru';const M=()=>lang==='ru'?' м':' m';const T=k=>D[lang][k];
/* Реклама: VK Bridge (VK Mini Apps). Вне VK — заглушки для локальной проверки */
const VK=window.vkBridge;
const Ads={
  show(fmt,ok,fail){
    if(!VK)return fail();
    VK.send('VKWebAppCheckNativeAds',{ad_format:fmt})
      .then(d=>d&&d.result?VK.send('VKWebAppShowNativeAds',{ad_format:fmt}).then(r=>r&&r.result?ok():fail()):fail())
      .catch(()=>fail());
  },
  inter(done){if(!VK)return done();Ads.show('interstitial',done,done)},
  reward(ok){if(!VK)return ok();Ads.show('reward',ok,()=>{})}
};
if(VK){
  VK.send('VKWebAppInit').catch(()=>{});
  VK.send('VKWebAppGetLaunchParams').then(p=>{
    lang=['ru','uk','be','kk','uz'].includes(String(p.vk_language))?'ru':'en';
    document.documentElement.lang=lang;document.title=T('ti');ui();
  }).catch(()=>{});
}

const cv=$('#cv'),g=cv.getContext('2d'),W=800,H=450,WY=270,PX=90;
const ZS=[40,200,500,1000,2000];
const FISH=[[['🐟',2],['🦐',3],['🐚',6]],[['🐠',7],['🦀',10],['🐡',16]],[['🦑',22],['🐙',30],['🐢',48]],[['🦈',65],['🐬',95],['🦭',140]],[['🐋',210],['🦞',380],['💎',1200]]];
const ZC=['#3bb4a6','#2a8fa6','#1f6a99','#16406b','#0c1f3d'];
let S={money:0,bag:0,n:0,st:0,hk:0,lk:0,best:0,zone:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('df')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('df',JSON.stringify(S))}catch(e){}};
const maxD=()=>90+60*S.st,view=()=>maxD()*1.12,sx=d=>PX+d/view()*(W-PX-30);
const KEYS=['st','hk','lk'],CAP=[999,9,8];
const cost=i=>Math.round([25*1.35**S.st,60*1.5**S.hk,80*1.6**S.lk][i]);
const info=i=>i==0?maxD()+M():i==1?(1+S.hk)+' 🐟':'+'+S.lk*2+'%';

function ui(){
  $('#mo').textContent=S.money.toLocaleString();
  $('#bg').innerHTML='🎒 '+S.n+' · '+S.bag+' <small>'+T('best')+S.best+M()+'</small>';
  $('#sell').textContent=T('sell')+(S.bag?' +'+S.bag:'');$('#sell').disabled=!S.bag;
  $('#dbl').textContent=T('dbl')+(S.bag?' +'+S.bag*2:'');$('#dbl').disabled=!S.bag;
  KEYS.forEach((k,i)=>{const b=$('#u'+i),mx=S[k]>=CAP[i];
    b.innerHTML='<b>'+T('u'+i)+'</b><span>'+T('lv')+(S[k]+1)+' · '+info(i)+'</span><em>'+(mx?T('max'):'💰 '+cost(i))+'</em>';
    b.disabled=mx||S.money<cost(i)});
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}

let ph='idle',t=0,p=0,dir=1,Dd=0,msg=null,time=0,last=0;
function begin(){if(ph==='idle'){ph='charge';p=0;dir=1}}
function release(){if(ph==='charge'){Dd=p*maxD();ph='fly';t=0}}
function resolve(){
  const z=ZS.reduce((a,b,i)=>Dd>=b?i:a,-1);
  if(z<0)msg={x:sx(Dd),txt:'💨 '+T('short')};
  else{
    const k=1+S.hk,w1=Math.max(.3,.72-.05*S.lk),w2=w1+.22+.02*S.lk;let sum=0,em='';
    for(let i=0;i<k;i++){const r=R(),f=FISH[z][r<w1?0:r<w2?1:2];sum+=f[1];em+=f[0]}
    S.bag+=sum;S.n+=k;msg={x:sx(Dd),txt:em+'  +'+sum};
    S.best=Math.max(S.best,Math.round(Dd));
    if(z>S.zone){S.zone=z;toast(T('newz')+T('z')[z]);Ads.inter(()=>{})}
    save();ui();
  }
  ph='res';t=0;
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;
  if(ph==='charge'){p+=dir*dt*1.1;if(p>=1){p=1;dir=-1}if(p<=0){p=0;dir=1}}
  else if(ph==='fly'){t+=dt/.85;if(t>=1){t=0;ph='wait'}}
  else if(ph==='wait'){t+=dt;if(t>.7)resolve()}
  else if(ph==='res'){t+=dt;if(t>1.6)ph='idle'}
  draw();requestAnimationFrame(loop);
}
function draw(){
  let gr=g.createLinearGradient(0,0,0,WY);gr.addColorStop(0,'#2b2d6e');gr.addColorStop(1,'#f4a261');
  g.fillStyle=gr;g.fillRect(0,0,W,WY);
  g.fillStyle='#ffd29d';g.beginPath();g.arc(620,WY-30,46,0,7);g.fill();
  g.fillStyle='#3a2f5c';g.beginPath();g.moveTo(0,WY);g.lineTo(150,WY-60);g.lineTo(300,WY);g.lineTo(480,WY-40);g.lineTo(640,WY);g.fill();
  const sh=sx(ZS[0]);g.fillStyle='#e9c46a';g.fillRect(0,WY,sh,H-WY);
  g.font='14px system-ui';g.textBaseline='alphabetic';g.textAlign='left';
  ZS.forEach((z0,i)=>{
    const x0=sx(z0),x1=i<4?Math.min(W,sx(ZS[i+1])):W;if(x0>=W)return;
    g.fillStyle=ZC[i];g.fillRect(x0,WY,x1-x0,H-WY);
    g.fillStyle='#0003';g.fillRect(x0,WY,2,H-WY);
    g.fillStyle='#fff';g.fillText(i>S.zone?'🔒 ?':T('z')[i],x0+8,WY+22);
    g.fillStyle='#ffffffaa';g.fillText(z0+M(),x0+8,WY+40);
    if(x1-x0>70&&i<=S.zone)[.25,.55,.8].forEach((f,j)=>{g.font='22px serif';g.fillText(FISH[i][j][0],x0+(x1-x0)*f,WY+90+(j%2)*70+Math.sin(time*1.5+j+i)*6);g.font='14px system-ui'});
  });
  g.fillStyle='#6b4226';g.fillRect(0,WY-8,PX+30,10);g.fillRect(20,WY,8,40);g.fillRect(PX+10,WY,8,40);
  g.fillStyle='#1d2340';g.fillRect(52,WY-50,14,42);g.beginPath();g.arc(59,WY-58,9,0,7);g.fill();
  const tx=PX,ty=WY-70;g.strokeStyle='#d9c3a0';g.lineWidth=3;g.beginPath();g.moveTo(62,WY-40);g.lineTo(tx,ty);g.stroke();
  const lx=sx(Dd);let lu=null;
  if(ph==='fly')lu=[tx+(lx-tx)*t,ty+(WY-ty)*t-140*Math.sin(Math.PI*t)];
  else if(ph==='wait')lu=[lx,WY+4+Math.sin(time*8)*2];
  if(lu){g.strokeStyle='#fff9';g.lineWidth=1;g.beginPath();g.moveTo(tx,ty);g.lineTo(lu[0],lu[1]);g.stroke();
    g.fillStyle='#e63946';g.beginPath();g.arc(lu[0],lu[1],5,0,7);g.fill()}
  if(ph==='wait'&&Dd>=ZS[0]){g.strokeStyle='#fff';g.globalAlpha=1-t/.7;g.beginPath();g.ellipse(lx,WY+3,10+t*50,3+t*10,0,0,7);g.stroke();g.globalAlpha=1}
  if(ph==='charge'){
    const ax=sx(p*maxD());g.strokeStyle='#ffc857';g.lineWidth=2;g.setLineDash([5,5]);g.beginPath();g.moveTo(ax,WY-50);g.lineTo(ax,WY+70);g.stroke();g.setLineDash([]);
    g.fillStyle='#ffc857';g.textAlign='center';g.fillText(Math.round(p*maxD())+M(),ax,WY-58);g.textAlign='left';
    g.fillStyle='#0006';g.fillRect(20,H-34,220,16);g.fillStyle=p>.85?'#e63946':'#ffc857';g.fillRect(20,H-34,220*p,16);
  }
  if(ph==='res'&&msg){
    const a=1-Math.max(0,t-1)/.6;g.globalAlpha=Math.max(0,a);g.font='bold 24px serif';g.textAlign='center';g.fillStyle='#fff';
    g.fillText(msg.txt,Math.min(Math.max(msg.x,150),W-150),WY-24-t*40);g.globalAlpha=1;g.textAlign='left';g.font='14px system-ui';
  }
  if(ph==='idle'){g.fillStyle='#fffc';g.textAlign='center';g.font='15px system-ui';g.fillText(T('hint'),W/2,H-14);g.textAlign='left'}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();begin()});
addEventListener('pointerup',release);
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();begin()}});
addEventListener('keyup',e=>{if(e.code==='Space')release()});
$('#sell').onclick=()=>{S.money+=S.bag;S.bag=0;S.n=0;save();ui()};
$('#dbl').onclick=()=>Ads.reward(()=>{S.money+=S.bag*2;S.bag=0;S.n=0;save();ui()});
KEYS.forEach((k,i)=>$('#u'+i).onclick=()=>{const c=cost(i);if(S.money>=c&&S[k]<CAP[i]){S.money-=c;S[k]++;save();ui()}});
ui();requestAnimationFrame(loop);
</script>
</body>
</html>
